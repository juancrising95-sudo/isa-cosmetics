  <div class="zonas-click">
    <a href="facial.html"     class="zona z1" onclick="guardarCatalogo()"></a>

    <a href="capilar.html"    class="zona z3" onclick="guardarCatalogo()"></a>

    <a href="perfumes.html"   class="zona z6" onclick="guardarCatalogo()"></a>

<!-- SECCIÓN 3 — CONTACTO -->
<section class="pantalla">
  <img src="assets/información.png" class="img-fondo">
  <div class="zonas-click">
    <a href="https://wa.me/59168807598" class="zona contacto"></a>
    <a href="https://maps.google.com"   class="zona mapa"></a>
  </div>
</section>

<!-- SCRIPTS -->
<script src="sparkles.js"></script>
<script src="install-app.js"></script>

<!-- Navegación: volver a categorías al regresar -->
<script>
function guardarCatalogo() {
  sessionStorage.setItem("volverCatalogo", "si");
}
window.addEventListener("load", function () {
  if (sessionStorage.getItem("volverCatalogo") === "si") {
    sessionStorage.removeItem("volverCatalogo");
    const ancla = document.getElementById("ancla-categorias");
    const y = ancla.getBoundingClientRect().top + window.pageYOffset;
    window.scrollTo(0, y);
  }
});
</script>

<!-- Carga dinámica del título de promoción activa desde Supabase -->
<script type="module">
import { supabase } from "./supabase.js"

async function cargarPromoIndex() {
  const { data, error } = await supabase
    .from("banners")
    .select("titulo")
    .eq("activo", true)
    .order("orden", { ascending: true })
    .limit(1)
    .single()

  if (error || !data) return

  const titulo = document.getElementById("promo-titulo-index")
  if (titulo) titulo.textContent = data.titulo || "PROMOCIÓN ESPECIAL"
}

cargarPromoIndex()
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const fecha = new Date();

  const meses = [
    "ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO",
    "JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"
  ];

  const fechaEl = document.getElementById("fecha-catalogo");

  if (fechaEl) {
    fechaEl.textContent =
      `${fecha.getDate()} DE ${meses[fecha.getMonth()]} DE ${fecha.getFullYear()}`;
  }

});
</script>
