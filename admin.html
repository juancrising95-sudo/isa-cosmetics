<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - ISA Cosmetics</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">

  <!-- PWA ADMIN -->
  <link rel="manifest" href="manifest-admin.json">

  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

 <link rel="apple-touch-icon" href="admin-icon-192.png">
 </head>
<body class="admin-body">

  <!-- LOGIN -->
  <div id="pantalla-login">
    <div class="login-box">
      <h2>🔐 Acceso Administrador</h2>
      <p>ISA Cosmetics</p>
      <input type="email" id="email" placeholder="Correo electrónico">
      <input type="password" id="password" placeholder="Contraseña">
      <button id="btn-login">Ingresar</button>
      <p id="login-error"></p>
    </div>
  </div>

  <!-- PANEL -->
  <div id="panel-admin" style="display:none">
    <div class="admin-header">
      <h1>⚙️ Panel Admin — ISA Cosmetics</h1>
      <div class="admin-user">
        <span id="usuario-activo"></span>
        <button id="btn-logout">Cerrar sesión</button>
      </div>
    </div>

    <div class="admin-tabs">
      <button class="tab-btn activo" data-tab="productos">📦 Productos</button>
      <button class="tab-btn" data-tab="marcas">🏷️ Marcas</button>
      <button class="tab-btn" data-tab="promociones">🎯 Promociones</button>
    </div>

    <!-- TAB PRODUCTOS -->
    <div id="tab-productos" class="tab-contenido">
      <div class="seccion-header">
        <h2>Productos</h2>
        <button id="btn-nuevo-producto" class="btn-agregar">+ Agregar producto</button>
      </div>

      <div class="filtros">
        <select id="filtro-categoria"><option value="">Todas las categorías</option></select>
        <select id="filtro-marca"><option value="">Todas las marcas</option></select>
      </div>
      <div class="barra-busqueda">
        <input type="text" id="buscar-producto" placeholder="🔍 Buscar producto por nombre...">
        <span id="contador-productos"></span>
      </div>
      <div id="lista-productos" class="lista-admin"></div>
    </div>

    <!-- TAB MARCAS -->
    <div id="tab-marcas" class="tab-contenido" style="display:none">
      <div class="seccion-header">
  <h2>Marcas</h2>

  <button id="btn-nueva-marca" class="btn-agregar">
    + Agregar marca
  </button>
</div>

<div class="barra-busqueda">
  <span id="contador-marcas"></span>
</div>
      <div id="lista-marcas" class="lista-admin"></div>
    </div>

    <!-- TAB PROMOCIONES -->
    <div id="tab-promociones" class="tab-contenido" style="display:none">
      <div class="seccion-header">
        <h2>Promociones</h2>
        <button id="btn-nueva-promo" class="btn-agregar">+ Agregar promoción</button>
      </div>
      <p style="color:#aaa;font-size:0.85rem;padding:0 0 12px 0">
        Sube aquí la imagen de promoción. Se guarda en Supabase y puedes usarla cuando quieras.
      </p>
      <div id="lista-promociones" class="lista-admin"></div>
    </div>
  </div>

  <!-- MODAL PRODUCTO -->
  <div id="modal-producto" class="modal" style="display:none">
    <div class="modal-box">
      <h3 id="modal-prod-titulo">Producto</h3>
      <input type="hidden" id="prod-id">
      <input type="hidden" id="prod-imagen">
      <label>Imagen del producto</label>
      <div class="imagen-preview-box">
        <img id="preview-prod-imagen" src="" alt="Preview" style="display:none">
        <div id="preview-prod-placeholder">Sin imagen</div>
      </div>
      <div class="imagen-botones">
        <input type="file" id="input-prod-imagen" accept="image/*" style="display:none">
        <button type="button" id="btn-subir-prod-imagen" class="btn-imagen">📷 Subir imagen</button>
        <button type="button" id="btn-quitar-prod-imagen" class="btn-imagen btn-imagen-quitar">🗑️ Quitar</button>
      </div>
      <p id="upload-prod-status"></p>
      <label>Nombre</label>
      <input type="text" id="prod-nombre" placeholder="Nombre del producto">
      <label>Descripción</label>
      <textarea id="prod-descripcion" rows="5" placeholder="Descripción del producto"></textarea>
      <label>Precio (Bs)</label>
      <input type="text" id="prod-precio" placeholder="Ej: 150">
      <label>Categoría</label>
      <select id="prod-categoria"></select>
      <label>Marca</label>
      <select id="prod-marca"></select>
      <label class="check-label">
        <input type="checkbox" id="prod-activo" checked>
        Producto activo (visible en catálogo)
      </label>
      <div class="modal-botones">
        <button id="btn-guardar-producto" class="btn-guardar">Guardar</button>
        <button id="btn-cancelar-producto" class="btn-cancelar">Cancelar</button>
      </div>
      <p id="modal-prod-error"></p>
    </div>
  </div>

  <!-- MODAL MARCA -->
  <div id="modal-marca" class="modal" style="display:none">
    <div class="modal-box">
      <h3 id="modal-marca-titulo">Marca</h3>
      <input type="hidden" id="marca-id">
      <input type="hidden" id="marca-logo">
      <label>Logo de la marca</label>
      <div class="imagen-preview-box">
        <img id="preview-marca-logo" src="" alt="Logo" style="display:none">
        <div id="preview-marca-placeholder">Sin logo</div>
      </div>
      <div class="imagen-botones">
        <input type="file" id="input-marca-logo" accept="image/*" style="display:none">
        <button type="button" id="btn-subir-marca-logo" class="btn-imagen">📷 Subir logo</button>
        <button type="button" id="btn-quitar-marca-logo" class="btn-imagen btn-imagen-quitar">🗑️ Quitar</button>
      </div>
      <p id="upload-marca-status"></p>
      <label>Nombre de la marca</label>
      <input type="text" id="marca-nombre" placeholder="Ej: NIVEA">
      
      <label>Orden (número para ordenar)</label>
      <input type="number" id="marca-orden" placeholder="Ej: 1">
      <label class="check-label">
        <input type="checkbox" id="marca-activo" checked>
        Marca activa (visible en catálogo)
      </label>
      <div class="modal-botones">
        <button id="btn-guardar-marca" class="btn-guardar">Guardar</button>
        <button id="btn-cancelar-marca" class="btn-cancelar">Cancelar</button>
      </div>
      <p id="modal-marca-error"></p>
    </div>
  </div>

  <!-- MODAL PROMOCION -->
<div id="modal-promo" class="modal" style="display:none">
  <div class="modal-box">
    <h3 id="modal-promo-titulo">Promoción</h3>
    <input type="hidden" id="promo-id">
    <input type="hidden" id="promo-imagen">
    <label>Imagen de la promoción</label>
    <div class="imagen-preview-box">
      <img id="preview-promo-imagen" src="" alt="Promo" style="display:none">
      <div id="preview-promo-placeholder">Sin imagen</div>
    </div>
    <div class="imagen-botones">
      <input type="file" id="input-promo-imagen" accept="image/*" style="display:none">
      <button type="button" id="btn-subir-promo-imagen" class="btn-imagen">📷 Subir imagen</button>
      <button type="button" id="btn-quitar-promo-imagen" class="btn-imagen btn-imagen-quitar">🗑️ Quitar</button>
    </div>
    <p id="upload-promo-status"></p>
    <label>Título (referencia interna)</label>
    <input type="text" id="promo-titulo" placeholder="Ej: Promo Mayo 2026">
    <label class="check-label">
      <input type="checkbox" id="promo-activo" checked>
      Promoción activa
    </label>
    <div class="modal-botones">
      <button id="btn-guardar-promo" class="btn-guardar">Guardar</button>
      <button id="btn-cancelar-promo" class="btn-cancelar">Cancelar</button>
    </div>
    <p id="modal-promo-error"></p>
  </div>
</div>

<script type="module">
import { supabase } from "./supabase.js"

// ── AUTH ──────────────────────────────────────────
const { data: { session } } = await supabase.auth.getSession()
if (session) iniciarPanel(session.user.email)

document.getElementById("btn-login").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim()
  const password = document.getElementById("password").value.trim()
  const { data, error } = await supabase.auth.signInWithPassword({ email, password })
  if (error) {
    document.getElementById("login-error").textContent = "Correo o contraseña incorrectos."
  } else {
    iniciarPanel(data.user.email)
  }
})

document.getElementById("btn-logout").addEventListener("click", async () => {
  await supabase.auth.signOut()
  location.reload()
})

function iniciarPanel(email) {
  document.getElementById("pantalla-login").style.display = "none"
  document.getElementById("panel-admin").style.display = "block"
  document.getElementById("usuario-activo").textContent = email
  cargarTodo()
}

// ── TABS ──────────────────────────────────────────
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("activo"))
    document.querySelectorAll(".tab-contenido").forEach(t => t.style.display = "none")
    btn.classList.add("activo")
    document.getElementById("tab-" + btn.dataset.tab).style.display = "block"
  })
})

// ── DATOS GLOBALES ────────────────────────────────
let categorias = []
let marcas = []

async function cargarTodo() {
  const [resCat, resMar] = await Promise.all([
    supabase.from("categorias").select("*").order("orden"),
    supabase.from("marcas").select("*").order("nombre")
  ])
  categorias = resCat.data || []
  marcas = resMar.data || []
  llenarFiltros()
  cargarProductos()
  cargarMarcasPanel()
  cargarPromociones()
}

// ── FILTROS ───────────────────────────────────────
function llenarFiltros() {
  const selCat = document.getElementById("filtro-categoria")
  const selMar = document.getElementById("filtro-marca")
  categorias.forEach(c => { selCat.innerHTML += `<option value="${c.id}">${c.nombre}</option>` })
  marcas.forEach(m => { selMar.innerHTML += `<option value="${m.id}">${m.nombre}</option>` })
  selCat.addEventListener("change", cargarProductos)
  selMar.addEventListener("change", cargarProductos)
  document.getElementById("buscar-producto").addEventListener("input", cargarProductos)
}

// ── PRODUCTOS ─────────────────────────────────────
async function cargarProductos() {
  const catId = document.getElementById("filtro-categoria").value
  const marId = document.getElementById("filtro-marca").value
  const busqueda = document.getElementById("buscar-producto").value.toLowerCase().trim()
  let query = supabase.from("productos")
    .select("*, marcas(nombre), categorias(nombre)").order("orden")
  if (catId) query = query.eq("categoria_id", catId)
  if (marId) query = query.eq("marca_id", marId)
  const { data, error } = await query
  if (error) { console.error(error); return }
  const filtrados = busqueda ? data.filter(p => p.nombre.toLowerCase().includes(busqueda)) : data
  document.getElementById("contador-productos").textContent =
    `${filtrados.length} producto${filtrados.length !== 1 ? 's' : ''} encontrado${filtrados.length !== 1 ? 's' : ''}`
  const lista = document.getElementById("lista-productos")
  lista.innerHTML = ""
  filtrados.forEach((p, index) => {
    const div = document.createElement("div")
    div.className = "item-admin"
    div.innerHTML = `
      <span class="item-numero">${index + 1}</span>
      <img src="${p.imagen_url || ''}" onerror="this.style.display='none'" class="item-thumb">
      <div class="item-info">
        <strong>${p.nombre}</strong>
        <span>${p.marcas?.nombre || ''} — ${p.categorias?.nombre || ''}</span>
        <span class="precio-tag">${p.precio ? 'Bs ' + String(p.precio).replace(/^Bs\s*/i,'') : 'S/P'}</span>
        <span class="estado-tag ${p.activo ? 'activo' : 'inactivo'}">${p.activo ? 'Activo' : 'Inactivo'}</span>
      </div>
      <div class="item-acciones">
        <button onclick="editarProducto('${p.id}')">✏️ Editar</button>
        <button onclick="eliminarProducto('${p.id}')" class="btn-eliminar">🗑️ Eliminar</button>
      </div>`
    lista.appendChild(div)
  })
}

// ── HELPER IMÁGENES ───────────────────────────────
function setupImageUpload({ inputId, btnSubirId, btnQuitarId, previewImgId, placeholderId, hiddenId, statusId, carpeta }) {
  function mostrarPreview(url) {
    const img = document.getElementById(previewImgId)
    const ph = document.getElementById(placeholderId)
    if (url) { img.src = url; img.style.display = "block"; ph.style.display = "none" }
    else { img.src = ""; img.style.display = "none"; ph.style.display = "flex" }
    document.getElementById(hiddenId).value = url || ""
  }
  document.getElementById(btnSubirId).addEventListener("click", () => {
    document.getElementById(inputId).click()
  })
  document.getElementById(btnQuitarId).addEventListener("click", () => {
    document.getElementById(inputId).value = ""
    document.getElementById(statusId).textContent = ""
    mostrarPreview("")
  })
  document.getElementById(inputId).addEventListener("change", async (e) => {
    const file = e.target.files[0]
    if (!file) return
    const status = document.getElementById(statusId)
    status.textContent = "⏳ Subiendo imagen..."
    status.style.color = "#aaa"
    const ext = file.name.split('.').pop().toLowerCase()
    const filename = `${carpeta}_${Date.now()}.${ext}`
    const { error } = await supabase.storage
      .from("catalogo").upload(`${carpeta}/${filename}`, file, { upsert: true })
    if (error) {
      status.textContent = "❌ Error al subir. Intenta de nuevo."
      status.style.color = "#f44336"
      console.error(error)
      return
    }
    const { data: urlData } = supabase.storage.from("catalogo").getPublicUrl(`${carpeta}/${filename}`)
    mostrarPreview(urlData.publicUrl)
    status.textContent = "✅ Imagen subida correctamente"
    status.style.color = "#4caf50"
  })
  return mostrarPreview
}

const mostrarPreviewProducto = setupImageUpload({
  inputId: "input-prod-imagen", btnSubirId: "btn-subir-prod-imagen",
  btnQuitarId: "btn-quitar-prod-imagen", previewImgId: "preview-prod-imagen",
  placeholderId: "preview-prod-placeholder", hiddenId: "prod-imagen",
  statusId: "upload-prod-status", carpeta: "productos"
})
const mostrarPreviewMarca = setupImageUpload({
  inputId: "input-marca-logo", btnSubirId: "btn-subir-marca-logo",
  btnQuitarId: "btn-quitar-marca-logo", previewImgId: "preview-marca-logo",
  placeholderId: "preview-marca-placeholder", hiddenId: "marca-logo",
  statusId: "upload-marca-status", carpeta: "marcas"
})
const mostrarPreviewPromo = setupImageUpload({
  inputId: "input-promo-imagen", btnSubirId: "btn-subir-promo-imagen",
  btnQuitarId: "btn-quitar-promo-imagen", previewImgId: "preview-promo-imagen",
  placeholderId: "preview-promo-placeholder", hiddenId: "promo-imagen",
  statusId: "upload-promo-status", carpeta: "promociones"
})

// ── MODAL PRODUCTO ────────────────────────────────
function abrirModalProducto(titulo, prod = null) {
  document.getElementById("modal-prod-titulo").textContent = titulo
  document.getElementById("prod-id").value = prod?.id || ""
  document.getElementById("prod-nombre").value = prod?.nombre || ""
  document.getElementById("prod-descripcion").value = prod?.descripcion || ""
  document.getElementById("prod-precio").value = prod?.precio || ""
  document.getElementById("prod-activo").checked = prod ? prod.activo : true
  document.getElementById("modal-prod-error").textContent = ""
  document.getElementById("upload-prod-status").textContent = ""
  document.getElementById("input-prod-imagen").value = ""
  mostrarPreviewProducto(prod?.imagen_url || "")
  document.getElementById("prod-categoria").innerHTML = categorias.map(c =>
    `<option value="${c.id}" ${c.id === prod?.categoria_id ? 'selected' : ''}>${c.nombre}</option>`).join("")
  document.getElementById("prod-marca").innerHTML = marcas.map(m =>
    `<option value="${m.id}" ${m.id === prod?.marca_id ? 'selected' : ''}>${m.nombre}</option>`).join("")
  document.getElementById("modal-producto").style.display = "flex"
}

window.editarProducto = async (id) => {
  const { data: p } = await supabase.from("productos").select("*").eq("id", id).single()
  abrirModalProducto("Editar Producto", p)
}
document.getElementById("btn-nuevo-producto").addEventListener("click", () => abrirModalProducto("Nuevo Producto"))

document.getElementById("btn-guardar-producto").addEventListener("click", async () => {
  const id = document.getElementById("prod-id").value
  const datos = {
    nombre: document.getElementById("prod-nombre").value.trim(),
    descripcion: document.getElementById("prod-descripcion").value.trim(),
    precio: document.getElementById("prod-precio").value.trim(),
    imagen_url: document.getElementById("prod-imagen").value.trim(),
    categoria_id: document.getElementById("prod-categoria").value,
    marca_id: document.getElementById("prod-marca").value,
    activo: document.getElementById("prod-activo").checked
  }
  if (!datos.nombre) { document.getElementById("modal-prod-error").textContent = "El nombre es obligatorio."; return }
  const btn = document.getElementById("btn-guardar-producto")
  btn.textContent = "Guardando..."; btn.disabled = true
  let error
  if (id) { ({ error } = await supabase.from("productos").update(datos).eq("id", id)) }
  else { ({ error } = await supabase.from("productos").insert(datos)) }
  btn.textContent = "Guardar"; btn.disabled = false
  if (error) { document.getElementById("modal-prod-error").textContent = "Error al guardar."; console.error(error) }
  else { document.getElementById("modal-producto").style.display = "none"; cargarProductos() }
})

window.eliminarProducto = async (id) => {
  if (!confirm("¿Eliminar este producto?\nEsta acción no se puede deshacer.")) return
  await supabase.from("productos").delete().eq("id", id)
  cargarProductos()
}
document.getElementById("btn-cancelar-producto").addEventListener("click", () => {
  document.getElementById("modal-producto").style.display = "none"
})

// ── MARCAS ────────────────────────────────────────
async function cargarMarcasPanel() {
  const { data, error } = await supabase.from("marcas")
    .select("*").order("nombre")
  if (error) { console.error(error); return }
  marcas = data
  document.getElementById("contador-marcas").textContent =
  `${data.length} marca${data.length !== 1 ? 's' : ''} encontrada${data.length !== 1 ? 's' : ''}`
  const lista = document.getElementById("lista-marcas")
  lista.innerHTML = ""
  data.forEach((m, index) => {
    const div = document.createElement("div")
    div.className = "item-admin"
    div.innerHTML = `
      <span class="item-numero">${index + 1}</span>
      ${m.logo_url
        ? `<img src="${m.logo_url}" onerror="this.style.display='none'" class="item-thumb">`
        : '<div class="item-thumb-placeholder">Sin logo</div>'}
      <div class="item-info">
        <strong>${m.nombre}</strong>
        <span>Orden: ${m.orden || 'S/N'}</span>
        <span class="estado-tag ${m.activo ? 'activo' : 'inactivo'}">${m.activo ? 'Activa' : 'Inactiva'}</span>
      </div>
      <div class="item-acciones">
        <button onclick="editarMarca('${m.id}')">✏️ Editar</button>
        <button onclick="toggleMarca('${m.id}', ${m.activo})">${m.activo ? '🔴 Desactivar' : '🟢 Activar'}</button>
        <button onclick="eliminarMarca('${m.id}')" class="btn-eliminar">🗑️ Eliminar</button>
      </div>`
    lista.appendChild(div)
  })
}

function abrirModalMarca(titulo, m = null) {
  document.getElementById("modal-marca-titulo").textContent = titulo
  document.getElementById("marca-id").value = m?.id || ""
  document.getElementById("marca-nombre").value = m?.nombre || ""
  document.getElementById("marca-orden").value = m?.orden || ""
  document.getElementById("marca-activo").checked = m ? m.activo : true
  document.getElementById("modal-marca-error").textContent = ""
  document.getElementById("upload-marca-status").textContent = ""
  document.getElementById("input-marca-logo").value = ""
  mostrarPreviewMarca(m?.logo_url || "")
  
  document.getElementById("modal-marca").style.display = "flex"
}

window.editarMarca = async (id) => {
  const { data: m } = await supabase.from("marcas").select("*").eq("id", id).single()
  abrirModalMarca("Editar Marca", m)
}
document.getElementById("btn-nueva-marca").addEventListener("click", () => abrirModalMarca("Nueva Marca"))

document.getElementById("btn-guardar-marca").addEventListener("click", async () => {
  const id = document.getElementById("marca-id").value
  const datos = {
    nombre: document.getElementById("marca-nombre").value.trim().toUpperCase(),
    logo_url: document.getElementById("marca-logo").value.trim(),
    
    orden: parseInt(document.getElementById("marca-orden").value) || 99,
    activo: document.getElementById("marca-activo").checked
  }
  if (!datos.nombre) { document.getElementById("modal-marca-error").textContent = "El nombre es obligatorio."; return }
  const btn = document.getElementById("btn-guardar-marca")
  btn.textContent = "Guardando..."; btn.disabled = true
  let error
  if (id) { ({ error } = await supabase.from("marcas").update(datos).eq("id", id)) }
  else { ({ error } = await supabase.from("marcas").insert(datos)) }
  btn.textContent = "Guardar"; btn.disabled = false
  if (error) { document.getElementById("modal-marca-error").textContent = "Error al guardar."; console.error(error) }
  else { document.getElementById("modal-marca").style.display = "none"; cargarMarcasPanel() }
})

window.toggleMarca = async (id, activo) => {
  await supabase.from("marcas").update({ activo: !activo }).eq("id", id)
  cargarMarcasPanel()
}
window.eliminarMarca = async (id) => {
  if (!confirm("¿Eliminar esta marca?\nLos productos asociados quedarán sin marca.")) return
  await supabase.from("marcas").delete().eq("id", id)
  cargarMarcasPanel()
}
document.getElementById("btn-cancelar-marca").addEventListener("click", () => {
  document.getElementById("modal-marca").style.display = "none"
})

// ── PROMOCIONES ───────────────────────────────────
async function cargarPromociones() {
  const { data, error } = await supabase.from("banners").select("*").order("orden")
  if (error) { console.error(error); return }
  const lista = document.getElementById("lista-promociones")
  lista.innerHTML = ""
  if (!data || data.length === 0) {
    lista.innerHTML = "<p style='color:#aaa;padding:16px'>No hay promociones. Agrega una con el botón de arriba.</p>"
    return
  }
  data.forEach((p, index) => {
    const div = document.createElement("div")
    div.className = "item-admin"
    div.innerHTML = `
      <span class="item-numero">${index + 1}</span>
      ${p.imagen_url
        ? `<img src="${p.imagen_url}" onerror="this.style.display='none'" class="item-thumb">`
        : '<div class="item-thumb-placeholder">Sin imagen</div>'}
      <div class="item-info">
        <strong>${p.titulo || 'Sin título'}</strong>
        <span class="estado-tag ${p.activo ? 'activo' : 'inactivo'}">${p.activo ? 'Activa' : 'Inactiva'}</span>
      </div>
      <div class="item-acciones">
        <button onclick="editarPromo('${p.id}')">✏️ Editar</button>
        <button onclick="eliminarPromo('${p.id}')" class="btn-eliminar">🗑️ Eliminar</button>
      </div>`
    lista.appendChild(div)
  })
}

function abrirModalPromo(titulo, p = null) {
  document.getElementById("modal-promo-titulo").textContent = titulo
  document.getElementById("promo-id").value = p?.id || ""
  document.getElementById("promo-titulo").value = p?.titulo || ""
  document.getElementById("promo-activo").checked = p ? p.activo : true
  document.getElementById("modal-promo-error").textContent = ""
  document.getElementById("upload-promo-status").textContent = ""
  document.getElementById("input-promo-imagen").value = ""
  mostrarPreviewPromo(p?.imagen_url || "")
  document.getElementById("modal-promo").style.display = "flex"
}

window.editarPromo = async (id) => {
  const { data: p } = await supabase.from("banners").select("*").eq("id", id).single()
  abrirModalPromo("Editar Promoción", p)
}
document.getElementById("btn-nueva-promo").addEventListener("click", () => abrirModalPromo("Nueva Promoción"))

document.getElementById("btn-guardar-promo").addEventListener("click", async () => {
  const id = document.getElementById("promo-id").value
  const datos = {
    titulo: document.getElementById("promo-titulo").value.trim(),
    imagen_url: document.getElementById("promo-imagen").value.trim(),
    activo: document.getElementById("promo-activo").checked,
    orden: 1
  }
  if (!datos.titulo) { document.getElementById("modal-promo-error").textContent = "El título es obligatorio."; return }
  const btn = document.getElementById("btn-guardar-promo")
  btn.textContent = "Guardando..."; btn.disabled = true
  let error
  if (id) { ({ error } = await supabase.from("banners").update(datos).eq("id", id)) }
  else { ({ error } = await supabase.from("banners").insert(datos)) }
  btn.textContent = "Guardar"; btn.disabled = false
  if (error) { document.getElementById("modal-promo-error").textContent = "Error al guardar."; console.error(error) }
  else { document.getElementById("modal-promo").style.display = "none"; cargarPromociones() }
})

window.eliminarPromo = async (id) => {
  if (!confirm("¿Eliminar esta promoción?")) return
  await supabase.from("banners").delete().eq("id", id)
  cargarPromociones()
}
document.getElementById("btn-cancelar-promo").addEventListener("click", () => {
  document.getElementById("modal-promo").style.display = "none"
})

</script>

<script src="install-admin.js"></script>

</body>
